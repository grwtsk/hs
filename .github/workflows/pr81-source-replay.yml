# Bounded source validation for PR #81, not a manuscript/interface acceptance.
# No schedule, deployment, artifact upload, write token, or source modification.
name: PR81 complete source replay
"on":
  push:
    branches: [sources/79-edit-navigation]
    paths: [.github/workflows/pr81-source-replay.yml]
permissions:
  contents: read
concurrency:
  group: hs-pr81-complete-source-replay
  cancel-in-progress: false
jobs:
  source-replay:
    # Fail closed on a private repository: no billable runner is authorized.
    if: github.repository == 'grwtsk/hs' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the triggering commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the input and unchanged originals
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 86833d0a30bfd398bb7993dbe9b8371c32b258ce HEAD
          git diff --exit-code 86833d0a30bfd398bb7993dbe9b8371c32b258ce HEAD -- sources tools tests research
          printf 'INPUT_HEAD=%s\nINPUT_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          python3 --version
          git --version
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          import unittest
          p = Path('sources/assets/grwtsk.png')
          data = p.read_bytes()
          assert len(data) == 34918
          assert hashlib.sha256(data).hexdigest() == 'e197a1263819ae2c03a9776ac16076de75618aa9af7778d4acb266c6d5774692'
          expected = {'test_founding_source.py', 'test_refinements.py', 'test_mark_asset.py', 'test_edit_navigation.py'}
          assert {p.name for p in Path('tests').glob('test_*.py')} == expected
          suite = unittest.defaultTestLoader.discover('tests')
          print('DISCOVERED_TESTS=' + str(suite.countTestCases()))
          print('ORIGINAL_ASSET_OK bytes=34918')
          PY
      - name: Founding source
        run: python3 -B tools/book/check_founding_source.py check
      - name: Author refinements
        run: python3 -B tools/book/check_refinements.py check
      - name: Original mark and committed measurements
        run: python3 -B tools/book/inspect_mark.py check
      - name: NAV-01 exact source and manifest
        run: python3 -B tools/book/check_edit_navigation.py check
      - name: Complete repository unittest suite
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/hs-pr81-suite.log"
          if grep -Eq 'OK \(skipped=|skipped=[1-9]' "$RUNNER_TEMP/hs-pr81-suite.log"; then
            echo 'Unexpected skips: inspect the complete log.' >&2
            exit 1
          fi
      - name: Finite symbolic research with isolated pinned dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir --no-compile --only-binary=:all: --target "$RUNNER_TEMP/hs-pr81-math" sympy==1.14.0 mpmath==1.3.0
          PYTHONPATH="$RUNNER_TEMP/hs-pr81-math" python3 -B tools/book/check_influence_model.py
      - name: Whitespace and read-only postcondition
        run: |
          set -euo pipefail
          git diff --check
          git diff --check 921698405285f163d9bad3a27ec86a794b751578 HEAD
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: State the completion boundary
        if: always()
        run: |
          printf '%s\n' 'This run checks source custody, all discovered repository tests and finite symbolic examples.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Step results and logs are the execution evidence; this summary does not turn a failed or unrun step into a pass.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No G1/G2/G3 acceptance, independent semantic review, interface behavior, physical mass-gap proof or source-rights grant follows.' >> "$GITHUB_STEP_SUMMARY"
